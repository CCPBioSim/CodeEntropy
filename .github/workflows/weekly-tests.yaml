name: Weekly Unit Tests

on:
  schedule:
    - cron: '17 8 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit
    uses: CCPBioSim/.github/.github/workflows/ci-test-python.yaml@f4cec1ba490b4461bfbcfd6362a8587678908a7d # 0.12.0
    permissions:
      contents: read
      checks: write
      statuses: write
      pull-requests: write
    with:
      package: CodeEntropy
      lowest-dependencies-check: true
      test-path: tests/unit
      os: '["ubuntu-24.04", "macos-26", "windows-2025-vs2026"]'
      coverage: false
      timeout-minutes: 30
