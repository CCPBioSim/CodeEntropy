name: Coveralls Main

on:
  push:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coveralls-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coveralls:
    name: Build main coverage baseline
    uses: CCPBioSim/.github/.github/workflows/ci-test-python.yaml@461a1d682d4ec6cb47a6083ec6b0daf3434c935d # 0.2.0
    permissions:
      contents: read
      checks: write
      statuses: write
      pull-requests: write
    with:
      package: CodeEntropy
      test-path: tests/unit
      os: '["ubuntu-26.04"]'
      python-versions: '["3.15"]'
      coverage-python-version: "3.15"
      timeout-minutes: 30
