name: Update Regression Baselines

on:
  workflow_dispatch:

concurrency:
  group: update-regression-baselines-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update-baselines:
    name: Update regression baselines
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install testing dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[testing]

      - name: Update regression baselines
        run: pytest tests/regression --update-baselines --run-slow

      - name: Commit updated baselines
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7
        with:
          commit_message: "test(regression): update baselines"
          commit_user_name: github-actions[bot]
          commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com
