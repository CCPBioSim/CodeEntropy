name: Dependency Floors

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-floors-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lowest:
    name: Lowest dependencies
    uses: CCPBioSim/.github/.github/workflows/ci-test-python.yaml@9f4315e6f907ce6606ec2346848272d423c62acf # 0.9.0
    permissions:
      contents: read
      checks: write
      statuses: write
      pull-requests: write
    with:
      package: CodeEntropy
      lowest-dependencies: true
      test-path: tests/unit
      os: '["ubuntu-26.04", "macos-26", "windows-2025-vs2026"]'
      timeout-minutes: 30
