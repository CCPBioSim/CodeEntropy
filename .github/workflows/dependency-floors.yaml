name: Dependency Floors

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-floors-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lowest:
    name: Lowest dependencies
    uses: CCPBioSim/.github/.github/workflows/ci-lowest-dependencies.yaml@032ccd9e849d9a57dee16beb835b90e53de9c981 # 0.7.0
    permissions:
      contents: read
    with:
      test-path: tests/unit
      os: '["ubuntu-26.04", "macos-26", "windows-2025-vs2026"]'
      timeout-minutes: 30
