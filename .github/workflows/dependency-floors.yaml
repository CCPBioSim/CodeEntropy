name: Dependency Floors

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-floors-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lowest:
    name: Lowest dependencies
    uses: CCPBioSim/.github/.github/workflows/ci-lowest-dependencies.yaml@461a1d682d4ec6cb47a6083ec6b0daf3434c935d # 0.2.0
    permissions:
      contents: read
    with:
      test-path: tests/unit
      os: '["ubuntu-26.04", "macos-26", "windows-2025-vs2026"]'
      timeout-minutes: 30
