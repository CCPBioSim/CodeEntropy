name: Daily Unit Tests

on:
  schedule:
    - cron: '0 8 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit
    uses: CCPBioSim/.github/.github/workflows/ci-test-python.yaml@9f4315e6f907ce6606ec2346848272d423c62acf # 0.9.0
    permissions:
      contents: read
      checks: write
      statuses: write
      pull-requests: write
    with:
      package: CodeEntropy
      test-path: tests/unit
      os: '["ubuntu-24.04", "macos-26", "windows-2025-vs2026"]'
      coverage: false
      timeout-minutes: 30
