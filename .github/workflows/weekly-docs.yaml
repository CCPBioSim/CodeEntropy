name: Weekly Docs Build

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Docs build
    uses: CCPBioSim/.github/.github/workflows/ci-docs.yaml@461a1d682d4ec6cb47a6083ec6b0daf3434c935d # 0.2.0
    permissions:
      contents: read
    with:
      os: '["ubuntu-24.04", "windows-2025-vs2026", "macos-26"]'
      python-versions: '["3.12", "3.13", "3.14"]'
      timeout-minutes: 30
